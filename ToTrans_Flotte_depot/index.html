<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: barre latérale de navigation (bureau) / barre d'onglets défilante (téléphone), contenu en tableaux + fiches */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef3; --line:#d5dce5; --ink:#15212e; --ink-2:#4b5a6b; --ink-3:#7a8796;
  --navy:#1f3864; --navy-ink:#ffffff; --accent:#e0a100; --accent-ink:#1a1400; --focus:#2f6fd6;
  --ok:#17663a; --ok-bg:#dcf1e3; --warn:#8a4b00; --warn-bg:#ffe7c2; --bad:#9c1020; --bad-bg:#ffd9dd;
  --crit:#ffffff; --crit-bg:#b00020; --acc:#5b2c6f; --acc-bg:#ece3f2; --hs:#ffffff; --hs-bg:#262b33;
  --info:#1f4f9a; --info-bg:#dde9fb; --mute:#5a6675; --mute-bg:#e7ebf0; --amber-bg:#fff6d6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,33,46,.06),0 4px 14px rgba(20,33,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#161e28; --surface-2:#1d2733; --line:#2b3746; --ink:#e6ecf2; --ink-2:#a9b6c4; --ink-3:#7d8b9a;
  --navy:#2c4f8a; --navy-ink:#ffffff; --accent:#f0b429; --accent-ink:#1a1400; --focus:#6aa2ff;
  --ok:#7fdca0; --ok-bg:#163826; --warn:#ffc27a; --warn-bg:#3d2a0e; --bad:#ff9aa5; --bad-bg:#43161c;
  --crit:#ffffff; --crit-bg:#c2182f; --acc:#d6b8ea; --acc-bg:#33223f; --hs:#0f151c; --hs-bg:#c9d1db;
  --info:#9cc2ff; --info-bg:#182d4d; --mute:#a9b6c4; --mute-bg:#24303d; --amber-bg:#3a2f0c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#161e28; --surface-2:#1d2733; --line:#2b3746; --ink:#e6ecf2; --ink-2:#a9b6c4; --ink-3:#7d8b9a;
  --navy:#2c4f8a; --navy-ink:#ffffff; --accent:#f0b429; --accent-ink:#1a1400; --focus:#6aa2ff;
  --ok:#7fdca0; --ok-bg:#163826; --warn:#ffc27a; --warn-bg:#3d2a0e; --bad:#ff9aa5; --bad-bg:#43161c;
  --crit:#ffffff; --crit-bg:#c2182f; --acc:#d6b8ea; --acc-bg:#33223f; --hs:#0f151c; --hs-bg:#c9d1db;
  --info:#9cc2ff; --info-bg:#182d4d; --mute:#a9b6c4; --mute-bg:#24303d; --amber-bg:#3a2f0c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--navy) 232px,transparent 232px)}
.side{background:var(--navy);color:var(--navy-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:5px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(255,255,255,.16);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{font-family:var(--f-mono);font-size:11.5px;background:var(--crit-bg);color:#fff;border-radius:9px;padding:0 6px;min-width:20px;text-align:center}
.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.banner{border:1px solid var(--line);background:var(--amber-bg);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner[data-kind="info"]{background:var(--info-bg)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);max-width:72ch;font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.amb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb input[type=search],.tb select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 10px;min-width:0}
.tb input[type=search]{flex:1 1 220px;max-width:360px}
.tb .meta{margin-left:auto;color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 -6px;display:flex;align-items:center;gap:10px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;text-align:left;cursor:pointer}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--navy))}
.tile .l{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--ink-3)}
.tile.small .v{font-size:28px}
/* tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;letter-spacing:.03em;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--surface-2)}
.t tfoot td{font-weight:700;background:var(--amber-bg);border-top:2px solid var(--line)}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .d{white-space:nowrap;font-variant-numeric:tabular-nums}
.t .w{min-width:200px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.plate{font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.03em;border:1.5px solid var(--ink);border-radius:3px;padding:0 5px;background:var(--surface);white-space:nowrap;display:inline-block;line-height:1.5}
.pill{display:inline-block;border-radius:3px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.acc{background:var(--acc-bg);color:var(--acc)} .pill.hs{background:var(--hs-bg);color:var(--hs)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.amb{background:var(--amber-bg);color:var(--warn)}
.anom{color:var(--bad);font-size:12.5px}
.muted{color:var(--ink-3)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* grilles du tableau de bord */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:700;letter-spacing:.02em}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.bar .tr{position:relative;height:20px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fl{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--navy));border-radius:3px}
.bar .lb{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:6px;font-size:12.5px}
.bar .nv{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0}
.legend b{font-family:var(--f-mono);font-weight:600;margin-left:4px}
.stack{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0}
.al-list{display:flex;flex-direction:column}
.al-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.al-row:last-child{border-bottom:0}
.al-row .c{font-family:var(--f-mono);font-weight:600;min-width:30px;text-align:center;border-radius:4px;padding:1px 6px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* alertes */
.ablk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ablk>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;color:#fff;font-weight:700;font-size:14px}
.ablk>header.u{background:var(--crit-bg)} .ablk>header.o{background:#c46a10}
.ablk .act{font-size:13px;color:var(--ink-2);padding:8px 14px;border-bottom:1px solid var(--line);font-style:italic}
.ablk .tw{border:0;border-radius:0}
.ok-note{padding:10px 14px;color:var(--ok);font-size:13.5px;font-weight:600}
/* fiche */
.fiche-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fiche-h .plate{font-size:20px;padding:2px 10px;border-width:2px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}
.fields div{display:flex;flex-direction:column;border-bottom:1px dashed var(--line);padding-bottom:5px;min-width:0}
.fields span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.fields b{font-weight:600;overflow-wrap:anywhere}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.mod{background:var(--surface);border-radius:8px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.mod>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mod>header h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.mod .bd{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mod>footer{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 14px}
.fg .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:3px;margin-top:6px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.f.err input,.f.err select{border-color:var(--bad);background:var(--bad-bg)}
.f .em{font-size:12px;color:var(--bad);font-weight:600}
.calc{background:var(--surface-2);border-radius:5px;padding:10px 12px}
.calc h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* paramètres */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:2px 4px 2px 8px;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1;padding:0 3px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 8px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lock{font-size:11.5px;color:var(--ink-3)}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td,.mini th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.mini input{width:90px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px 6px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:8px 0 0;overflow:visible}
  .brand{padding:2px max(16px,env(safe-area-inset-left,0px)) 6px}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;padding:0 max(12px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--navy)}
}
@media (max-width:700px){
  .ph h1{font-size:25px}
  .tile .v{font-size:30px}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td,.rt tfoot{display:block;width:100%}
  .rt tr{border-bottom:1px solid var(--line);padding:8px 10px}
  .rt td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .rt td::before{content:attr(data-l);color:var(--ink-3);font-size:12px;text-align:left;flex:none;max-width:45%}
  .rt td.w{min-width:0}
  .rt td:empty{display:none}
  .rt tfoot tr{padding:8px 10px}
  .tw{overflow-x:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* --- application installable : connexion, synchronisation, utilisateurs --- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
body.authmode .side{display:none} body.authmode .app{grid-template-columns:minmax(0,1fr);background:none}
.authwrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.authbox{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;padding:22px}
.authbox h2{margin:0;font-family:var(--f-display);font-size:26px}
.authbrand{color:var(--navy);padding:0 0 6px}
.syncbox{margin-top:18px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px;font-size:13px}
.syncst{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:0;color:inherit;border-radius:5px;padding:6px 9px;cursor:pointer;text-align:left;font-size:13px}
.sdot{width:9px;height:9px;border-radius:50%;background:#8a96a4;flex:none}
.syncst.ok .sdot{background:#46c27a}.syncst.off .sdot{background:#f0b429}.syncst.err .sdot{background:#ff5c6c}.syncst.run .sdot{background:#9cc2ff}
.who{display:flex;flex-direction:column;padding:0 2px}.who small{opacity:.7}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
.ucards{display:flex;flex-direction:column;gap:12px}
.ucard{display:flex;flex-direction:column;gap:12px}.ucard.waiting{border-color:var(--accent);background:var(--amber-bg)}
.ucard header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.uflags{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.uflags label{display:flex;gap:6px;align-items:center}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.ugrid select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 7px}
.ucard footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){.syncbox{flex-direction:row;flex-wrap:wrap;align-items:center;margin:0;padding:6px max(12px,env(safe-area-inset-left,0px)) 8px;border-top:1px solid rgba(255,255,255,.15)}.who{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const nowD=new Date();
const TODAY=`${nowD.getFullYear()}-${pad(nowD.getMonth()+1)}-${pad(nowD.getDate())}`;
const dnum=s=>{if(!s)return null;const[y,m,d]=String(s).slice(0,10).split("-").map(Number);if(!y||!m||!d)return null;return Math.round(Date.UTC(y,m-1,d)/864e5)};
const dtnum=s=>{const d=dnum(s);if(d==null)return null;const t=String(s).length>10?String(s).slice(11,16).split(":").map(Number):[0,0];return d+((t[0]||0)*60+(t[1]||0))/1440};
const T=dnum(TODAY), NOW=T+(nowD.getHours()*60+nowD.getMinutes())/1440;
const isoOf=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const fD=s=>{if(!s)return"";const p=String(s).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(s)};
const fDT=s=>s?fD(s)+(String(s).length>10?" "+String(s).slice(11,16):""):"";
const num=v=>{const n=typeof v==="number"?v:parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const has=v=>v!==undefined&&v!==null&&v!=="";
const fN=(v,dec=0)=>has(v)&&v!==""?Number(v).toLocaleString("fr-FR",{maximumFractionDigits:dec,minimumFractionDigits:dec}):"";
const fM=v=>has(v)?Math.round(Number(v)).toLocaleString("fr-FR"):"";
const plate=s=>s?`<span class="plate">${esc(s)}</span>`:"";
const pill=(v,tone)=>v?`<span class="pill ${tone||toneOf(v)}">${esc(v)}</span>`:"";
const sum=(arr,f)=>arr.reduce((a,x)=>a+num(f(x)),0);
function toneOf(v){
  const s=String(v);
  if(s===ST_OK||s==="Disponible"||/^🟢|VALIDE$|^Permis valide|À jour|TERMINÉE|RÉPARÉE|CLÔTURÉ|ACTIF$|BON ÉTAT/.test(s))return"ok";
  if(s===ST_SS||s==="PANNE SANS SOLUTION")return"crit";
  if(s===ST_PG||s==="Immobilisé"||/^🔴|EXPIRÉ|GRAVE –|ENDOMMAGÉ|SUSPENDU/.test(s))return"bad";
  if(s===ST_MA||s==="Au garage"||/^🟠|PROCHE|EN RÉPARATION|EN ATTENTE DE PIÈCE|EN DIAGNOSTIC|SIGNALÉE|À INSPECTER|EN CONGÉ/.test(s))return"warn";
  if(s===ST_AR||s==="Accidenté"||s===AC_R)return"acc";
  if(s===ST_HS||s==="Hors service"||s===AC_HS||/^⚫|MANQUANT/.test(s))return"hs";
  if(/^🟡|SURVEILLER/.test(s))return"amb";
  if(/^En |EN COURS|PLANIFIÉE|Conteneur chargé/.test(s))return"info";
  return"";
}
const TONE_COL={ok:"var(--ok)",warn:"#d97a00",bad:"#d23142",crit:"#8e0016",acc:"#8e5bb0",hs:"#3a414c",info:"#2f6fd6",amb:"#e0a100",mute:"#8a96a4"};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function pool(items,n,fn,onProg){let i=0,done=0;const run=async()=>{while(i<items.length){const it=items[i++];await fn(it);done++;onProg&&onProg(done,items.length)}};await Promise.all(Array.from({length:n},run))}

/* Droits : "w" = saisie, "r" = lecture, absent = aucun accès */

const canW=col=>!!(ME&&ME.actif&&(ME.admin||(col!=="config"&&(ME.droits||{})[col]==="w")));
const isAdmin=()=>!!(ME&&ME.actif&&ME.admin);

function refreshRights(){CANWRITE=!!ME&&COLS.some(canW)}

/* Petite base IndexedDB clé → valeur */
const IDB=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("totrans-flotte",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction("kv",mode);const st=t.objectStore("kv");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})};
  return{get:k=>tx("readonly",s=>s.get(k)),set:(k,v)=>tx("readwrite",s=>s.put(v,k)),clear:()=>tx("readwrite",s=>s.clear())}})();
let persistT=null;
function persist(){clearTimeout(persistT);persistT=setTimeout(()=>{IDB.set("etat",{S,P,OUTBOX,LASTSYNC,ME,PROFILES,uid:SESSION&&SESSION.user.id}).catch(e=>console.warn("sauvegarde locale",e))},150)}
async function loadLocal(uid){try{const e=await IDB.get("etat");if(!e||e.uid!==uid)return false;
  COLS.forEach(c=>S[c]=(e.S&&e.S[c])||[]);P=mergeParams(e.P);OUTBOX=e.OUTBOX||[];LASTSYNC=e.LASTSYNC||null;ME=e.ME||null;PROFILES=e.PROFILES||{};return true}catch(e){return false}}

function applyLocal(col,id,data,deleted){
  if(col==="config"){if(!deleted)P=mergeParams(data);return}
  const i=S[col].findIndex(r=>r.id===id);
  if(deleted){if(i>=0)S[col].splice(i,1);return}
  const row={id,...data};if(i>=0)S[col][i]=row;else S[col].push(row);
}
function queue(col,id,data,deleted){
  OUTBOX=OUTBOX.filter(o=>!(o.col===col&&o.id===id));OUTBOX.push({col,id,data:data||{},deleted:!!deleted});
  persist();schedule();sync();
}
async function putDoc(col,id,data){
  if(!canW(col))throw{code:"invalid_argument"};
  data={...data};delete data._maj;delete data._par;
  applyLocal(col,id,{...data,_maj:new Date().toISOString(),_par:ME&&ME.id},false);queue(col,id,data,false);
}
async function delDoc(col,id){if(!canW(col))throw{code:"invalid_argument"};applyLocal(col,id,null,true);queue(col,id,null,true)}
async function saveParams(p){if(!isAdmin())throw{code:"invalid_argument"};P=mergeParams(p);queue("config","parametres",P,false)}

function setSync(state,err){SYNC={state,at:state==="ok"?new Date():SYNC.at,err:err||""};renderSync()}
async function sync(full){
  if(!SB||!SESSION||SYNCING)return;
  if(!navigator.onLine){setSync("offline");return}
  SYNCING=true;setSync("sync");
  try{
    // 1. envoyer les saisies faites sur cet appareil
    let refused=0;
    while(OUTBOX.length){
      const batch=OUTBOX.slice(0,100);
      const rows=batch.map(o=>({id:o.col+":"+o.id,col:o.col,data:o.data,deleted:o.deleted}));
      const{error}=await SB.from("records").upsert(rows);
      if(error){
        if(error.code==="42501"||/row-level security/i.test(error.message||"")){
          // droits insuffisants : on envoie une par une et on écarte celles refusées
          for(const o of batch){const{error:e2}=await SB.from("records").upsert({id:o.col+":"+o.id,col:o.col,data:o.data,deleted:o.deleted});if(e2)refused++}
          full=true;
        }else throw error;
      }
      const sent=new Set(batch);OUTBOX=OUTBOX.filter(o=>!sent.has(o));persist();
    }
    if(refused)toast(`${refused} modification(s) refusée(s) : vos droits ne permettent pas cette saisie.`);
    // 2. récupérer les changements faits par les autres
    let since=(!full&&LASTSYNC)?new Date(Date.parse(LASTSYNC)-120000).toISOString():"1970-01-01T00:00:00Z";
    if(full||!LASTSYNC){COLS.forEach(c=>S[c]=[])}
    for(let guard=0;guard<500;guard++){
      const{data,error}=await SB.from("records").select("id,col,data,deleted,updated_at,updated_by").gte("updated_at",since).order("updated_at").limit(1000);
      if(error)throw error;
      for(const r of data){const rid=r.id.slice(r.col.length+1);
        if(OUTBOX.some(o=>o.col===r.col&&o.id===rid))continue;
        if(r.col!=="config"&&!S[r.col])continue;
        applyLocal(r.col,rid,{...r.data,_maj:r.updated_at,_par:r.updated_by},r.deleted)}
      if(data.length){const last=data[data.length-1].updated_at;if(!LASTSYNC||last>LASTSYNC)LASTSYNC=last}
      if(data.length<1000)break;
      if(data[data.length-1].updated_at===since)break;
      since=data[data.length-1].updated_at;
    }
    // 3. profil et noms des utilisateurs
    await loadProfile();
    READY=true;persist();setSync(OUTBOX.length?"pending":"ok");
  }catch(e){console.warn("synchronisation",e);
    const offline=!navigator.onLine||/fetch|network/i.test(String(e&&(e.message||e)));
    setSync(offline?"offline":"err",offline?"":(e.message||String(e)));
  }finally{SYNCING=false;schedule()}
  if(OUTBOX.length&&navigator.onLine)setTimeout(()=>sync(),3000);
}
async function loadProfile(){
  const{data:me,error}=await SB.from("profiles").select("*").eq("id",SESSION.user.id).maybeSingle();
  if(error)throw error;
  const was=JSON.stringify(ME&&[ME.actif,ME.admin,ME.droits]);ME=me;refreshRights();
  if(ME&&ME.actif){const{data:all}=await SB.from("profiles").select("id,nom,email,role,droits,admin,actif,created_at").order("created_at");PROFILES=Object.fromEntries((all||[]).map(p=>[p.id,p]))}
  if(was!==JSON.stringify(ME&&[ME.actif,ME.admin,ME.droits]))schedule(true);
}

async function init(){

  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
  setInterval(()=>{if(!document.hidden)sync()},30000);

  SB=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});

  try{const{data}=await SB.auth.getSession();SESSION=data.session}catch(e){}

}

   ====================================================================== */
let C={};
function compute(){
  const sv=P.seuils;
  const V=S.vehicules, M=S.missions, CO=S.conteneurs, CH=S.chauffeurs, PN=S.pannes, MA=S.maintenances, AC=S.accidents, DO=S.documents, DE=S.depenses, EN=S.entretiens;
  const c={veh:{},mis:{},co:{},ch:{},pn:{},ma:{},ac:{},do:{},de:{},en:{}};
  const vByImmat={};V.forEach(v=>{if(v.immat&&!vByImmat[v.immat])vByImmat[v.immat]=v});
  const chByNom={};CH.forEach(x=>{if(x.nom&&!chByNom[x.nom])chByNom[x.nom]=x});
  const misByNum={};M.forEach(m=>{if(m.num&&!misByNum[m.num])misByNum[m.num]=m});
  c.vByImmat=vByImmat;c.chByNom=chByNom;c.misByNum=misByNum;
  // Missions (1re passe)
  M.forEach(m=>{const x={};
    x.fin=(!m.veh||!m.dep||m.statut==="ANNULÉE")?0:(m.reel?dnum(m.reel):Math.max(dnum(m.prev)||0,T));
    x.duree=(!m.dep||m.statut==="ANNULÉE"||dnum(m.dep)>T)?"":(m.reel?dnum(m.reel):T)-dnum(m.dep);
    x.retard=(m.statut==="EN COURS"&&m.prev&&T>dnum(m.prev))?T-dnum(m.prev):"";
    x.nbcont=m.num?CO.filter(k=>k.mission===m.num).length:0;
    c.mis[m.id]=x});
  M.forEach(m=>{const x=c.mis[m.id];x.conflit=false;if(!x.fin)return;const d0=dnum(m.dep);
    x.conflit=M.some(n=>{if(n===m)return false;const y=c.mis[n.id];if(!y.fin)return false;
      const same=(n.veh===m.veh)||(m.chauffeur&&n.chauffeur===m.chauffeur);return same&&dnum(n.dep)<x.fin&&y.fin>d0})});
  const missionAt=(veh,date)=>{const d=dnum(date);if(d==null)return"—";const m=M.find(m=>m.veh===veh&&dnum(m.dep)!=null&&dnum(m.dep)<=d&&c.mis[m.id].fin>=d);return m?m.num:"—"};
  // Conteneurs
  CO.forEach(k=>{const x={};const m=misByNum[k.mission];x.client=m?m.client||"":"";x.charg=m?m.charg||"":"";x.dest=m?m.dest||"":"";
    x.actif=!!(k.veh&&!k.ddeb&&k.sit!=="Conteneur débarqué du plateau");
    x.duree=k.dchg?((k.ddeb?dtnum(k.ddeb):NOW)-dtnum(k.dchg)):"";
    c.co[k.id]=x});
  CO.forEach(k=>{const x=c.co[k.id];const a=[];if(!k.veh)a.push("Camion non renseigné");

let pend=false,full=false;
function schedule(f){if(f)full=true;if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;const ff=full;full=false;render(ff)})}
let lastR=null;
function render(force){
  const view=$("#view");
  const gate=AUTHVIEW?vAuth():(SESSION&&READY&&(!ME||!ME.actif))?vPending():null;
  document.body.classList.toggle("authmode",!!gate);
  if(gate){view.innerHTML=gate;lastR=null;return}
  if(!routeOk(R)){R="tableau"}
  compute();renderNav();renderSync();
  const ae=document.activeElement;
  if(!force&&lastR===R&&R==="parametres"&&(DIRTY||BUSY||(view.contains(ae)&&ae.matches("input,select,textarea")))){renderBanner();return} // ne pas écraser une saisie en cours
  if(lastR===R&&!force&&LIST_R[R]){renderTable();renderBanner();return}
  lastR=R;
  const fn={tableau:vDash,alertes:vAlerts,fiche:vFiche,parametres:vParams,utilisateurs:vUsers}[R];
  view.innerHTML=`<div id="banner"></div>`+(fn?fn():vList());
  renderBanner();

  bindView();
}
function renderBanner(){
  const b=$("#banner");if(!b)return;

  else if(!navigator.onLine)h=`<div class="banner"><span>Vous êtes <b>hors connexion</b>. Vous pouvez consulter et saisir normalement : les modifications seront envoyées dès le retour d'Internet${OUTBOX.length?` (${OUTBOX.length} en attente)`:""}.</span></div>`;
  else if(!CANWRITE)h=`<div class="banner" data-kind="info">Accès en lecture seule : vous pouvez consulter mais pas modifier les données.</div>`;

function filtered(){

function tableHTML(rows,cols,opt={}){

/* ======================================================================
   FORMULAIRE (ajout / modification)
   ====================================================================== */
function opts(src){
  if(src.startsWith("!"))return LOCK[src.slice(1)];
  if(src==="@vehicules")return S.vehicules.map(v=>v.immat).filter(Boolean).sort();
  if(src==="@chauffeurs")return S.chauffeurs.map(h=>h.nom).filter(Boolean).sort((a,b)=>a.localeCompare(b,"fr"));
  if(src==="@missions")return S.missions.map(m=>m.num).filter(Boolean).sort().reverse();
  if(src==="@docs")return P.documents.map(d=>d.nom);
  if(src==="@entretiens")return P.entretiens.map(e=>e.type);
  return P.listes[src]||[];
}

};
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/\s+/g," ").trim().toLowerCase();
function xlVal(v,t){
  if(v===null||v===undefined||v==="")return undefined;
  if(t==="date"||t==="dt"||t==="time"){
    if(typeof v==="number"){const days=Math.floor(v),fr=v-days;const iso=isoOf(days-25569);const mins=Math.round(fr*1440);const hm=pad(Math.floor(mins/60)%24)+":"+pad(mins%60);
      return t==="date"?iso:t==="time"?hm:iso+"T"+hm}
    const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(v));if(m){const iso=`${m[3]}-${pad(m[2])}-${pad(m[1])}`;return t==="dt"?iso+"T"+pad(m[4]||0)+":"+(m[5]||"00"):iso}
    return String(v).trim()}
  if(t==="num"){const n=num(v);return isFinite(n)?n:undefined}
  const s=String(v).trim();return s===""?undefined:s;
}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:false});const out={};const notes=[];
  COLS.forEach(col=>{
    const E=ENT[col];const ws=wb.Sheets[E.sheet]||wb.Sheets[Object.keys(wb.Sheets).find(n=>norm(n)===norm(E.sheet))];
    if(!ws){notes.push(`Feuille « ${E.sheet} » absente`);out[col]=[];return}
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let hi=rows.findIndex(r=>r.some(c=>norm(c)===norm(XL[col][E.key==="veh"&&col==="depenses"?"veh":Object.keys(XL[col])[0]])));
    if(hi<0){notes.push(`En-têtes introuvables dans « ${E.sheet} »`);out[col]=[];return}
    const hdr=rows[hi].map(norm);const map={};
    Object.entries(XL[col]).forEach(([k,l])=>{const i=hdr.indexOf(norm(l));if(i>=0&&map[k]===undefined)map[k]=i});
    const types={};E.fields.forEach(f=>{if(f.k)types[f.k]=f.t});
    const recs=[];
    for(let r=hi+1;r<rows.length;r++){const row=rows[r];const d={};
      Object.entries(map).forEach(([k,i])=>{const v=xlVal(row[i],types[k]);if(v!==undefined)d[k]=v});
      const keyF=col==="depenses"?"veh":E.key;if(!has(d[keyF]))continue;recs.push(d)}
    out[col]=recs});
  return{out,notes};
}

    ["DOCUMENTS ADMINISTRATIFS","documents",r=>({...pick(r,"documents"),"Statut":c.do[r.id].statut,"Jours restants":c.do[r.id].jours})],
    ["CARBURANT & DÉPENSES","depenses",r=>({...pick(r,"depenses"),"Montant carburant":c.de[r.id].carb,"Total dépenses":c.de[r.id].total})],
    ["ENTRETIEN PRÉVENTIF","entretiens",r=>({...pick(r,"entretiens"),"Prochaine échéance (km)":c.en[r.id].ekm,"Prochaine échéance (date)":c.en[r.id].ej!==""?fD(isoOf(c.en[r.id].ej)):"","Km restants":c.en[r.id].krest,"Jours restants":c.en[r.id].jrest,"Statut":c.en[r.id].statut})],
  ];
  sheets.forEach(([name,col,f])=>{const ws=XLSX.utils.json_to_sheet(S[col].map(f),{header:Object.values(XL[col])});XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});
  const al=C.alerts.flatMap(a=>a.rows.map(r=>({"Niveau":a.u?"URGENT":"À TRAITER","Rubrique":a.lab,"Camion / chauffeur":r.veh||r.immat||r.nom||"","Détail":r.doc||r.num||r.type||r.classif||""})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(al),"ALERTES");
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const url=URL.createObjectURL(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a=document.createElement("a");a.href=url;a.download=`Gestion_Flotte_export_${TODAY}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Export téléchargé")
}
function pick(r,col){const o={};const types={};ENT[col].fields.forEach(f=>{if(f.k)types[f.k]=f.t});
  Object.entries(XL[col]).forEach(([k,l])=>{const v=r[k];o[l]=!has(v)?"":types[k]==="date"?fD(v):types[k]==="dt"?fDT(v):v});return o}
async function deleteDemo(){
  const z=$("#demoZone");BUSY=true;const items=COLS.flatMap(c=>S[c].filter(r=>r.demo).map(r=>[c,r.id]));
  z.innerHTML=`<span class="confirm">Supprimer les ${items.length} lignes d'exemple ? <button class="btn dng sm" id="dY">Oui, supprimer</button><button class="btn sm" id="dN">Non</button></span>`;
  $("#dN").onclick=()=>{BUSY=false;schedule(true)};
  $("#dY").onclick=async()=>{z.innerHTML=`<span class="muted" id="dP">Suppression…</span>`;let k=0;
    try{await pool(items,4,async([c,id])=>{await delDoc(c,id);k++;const p=$("#dP");if(p)p.textContent=`Suppression… ${k}/${items.length}`});BUSY=false;toast("Exemples supprimés");schedule(true)}
    catch(e){BUSY=false;toast("Suppression interrompue, réessayez");schedule(true)}}
}

/* ======================================================================
   ÉVÉNEMENTS
   ====================================================================== */
function bindView(){
  const v=$("#view");
  v.onclick=e=>{
    const nb=e.target.closest("[data-new]");if(nb){const col=nb.dataset.new;openForm(col,null,nb.dataset.veh?{veh:nb.dataset.veh}:null);return}
    const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
    const ev=e.target.closest("[data-edit-veh]");if(ev){openForm("vehicules",S.vehicules.find(x=>x.id===ev.dataset.editVeh));return}
    const tr=e.target.closest("tbody tr[data-i]");if(!tr)return;const i=+tr.dataset.i;
    const al=tr.closest("[data-al]"), hi=tr.closest("[data-hist]");
    if(al){const a=C.alerts[+al.dataset.al];const r=a.rows[i];
      if(r._missing){openForm("documents",null,{veh:r.veh,doc:r.doc});return}
      if(a.col==="vehicules"){FICHE=r.immat;go("fiche");return}openForm(a.col,r);return}
    if(hi){openForm(hi.dataset.hist,FICHE_ROWS[hi.dataset.hist][i]);return}
    if(tr.closest("#tbl")){const L=LIST_R[R];const r=CUR_ROWS[i];if(L.click)L.click(r);else openForm(L.col,r);return}
    if(R==="tableau"){const imm=tr.querySelector(".plate");if(imm){FICHE=imm.textContent;go("fiche")}}
  };
  v.onkeydown=e=>{if(e.key==="Enter"&&e.target.matches("tbody tr[data-i]"))e.target.click()};
  const q=$("#q");if(q)q.oninput=()=>{FILT[R].q=q.value;renderTable()};
  v.querySelectorAll("select[data-f]").forEach(s=>s.onchange=()=>{FILT[R][s.dataset.f]=s.value;renderTable()});
  const fs=$("#ficheSel");if(fs)fs.onchange=()=>{FICHE=fs.value;schedule(true)};
  if(R==="parametres")renderParamsDraft();
}
// Paramètres : écouteurs installés une seule fois
$("#view").addEventListener("input",e=>{if(R!=="parametres"||!DRAFT)return;const t=e.target;
  if(t.dataset.seuil){DRAFT.seuils[t.dataset.seuil]=t.dataset.seuil==="devise"?t.value:Number(t.value);DIRTY=true}
  if(t.dataset.ek!==undefined&&t.dataset.f){DRAFT.entretiens[+t.dataset.ek][t.dataset.f]=t.value===""?null:Number(t.value);DIRTY=true}
  if(t.dataset.dob!==undefined){DRAFT.documents[+t.dataset.dob].obligatoire=t.checked;DIRTY=true}});
$("#view").addEventListener("click",e=>{if(R!=="parametres"||!DRAFT)return;const t=e.target;const v=$("#view");
  if(t.dataset.rm){DRAFT.listes[t.dataset.rm].splice(+t.dataset.i,1);DIRTY=true;renderParamsDraft()}
  if(t.dataset.add){const k=t.dataset.add;const inp=v.querySelector(`[data-addin="${k}"]`);const val=inp.value.trim();if(val&&!(DRAFT.listes[k]||[]).includes(val)){(DRAFT.listes[k]=DRAFT.listes[k]||[]).push(val);DIRTY=true;renderParamsDraft();v.querySelector(`[data-addin="${k}"]`).focus()}}
  if(t.dataset.erm!==undefined){DRAFT.entretiens.splice(+t.dataset.erm,1);DIRTY=true;renderParamsDraft()}
  if(t.dataset.drm!==undefined){DRAFT.documents.splice(+t.dataset.drm,1);DIRTY=true;renderParamsDraft()}
  if(t.id==="entAdd"){const i=$("#entNew");if(i.value.trim()){DRAFT.entretiens.push({type:i.value.trim(),km:null,jours:null});i.value="";DIRTY=true;renderParamsDraft()}}
  if(t.id==="docAdd"){const i=$("#docNew");if(i.value.trim()){DRAFT.documents.push({nom:i.value.trim(),obligatoire:true});i.value="";DIRTY=true;renderParamsDraft()}}
  if(t.id==="saveP"){t.disabled=true;saveParams(DRAFT).then(()=>{DIRTY=false;toast("Paramètres enregistrés");schedule(true)}).catch(()=>{t.disabled=false;toast("Enregistrement impossible")})}
  if(t.id==="impBtn")$("#fileIn").click();
  if(t.id==="expBtn")doExport();
  if(t.id==="demoBtn")deleteDemo();
});
$("#view").addEventListener("keydown",e=>{if(R==="parametres"&&e.key==="Enter"&&e.target.dataset.addin){e.preventDefault();$("#view").querySelector(`[data-add="${e.target.dataset.addin}"]`).click()}});
$("#fileIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)doImport(f)};
init();
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(e=>console.warn("service worker",e))}
</script>
